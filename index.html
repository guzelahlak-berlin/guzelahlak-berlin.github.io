<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2547">
<title>Benim Yolum · Güzel Ahlak Yolunda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: fröhlich, comic-haft wie dotoku.app – für Mädchen von 15 bis 18
   IDEA: der gedruckte Tatenkalender als Handy-Seite zum Antippen
   PICTURE: die 7 Tageskreise der Woche und das Bingo-Feld
   COLOUR and TYPE: DOTOKU-Navy, Amber und Rot auf Creme; Anton für Titel, Nunito für Text
   LAYOUT: eine Spalte, Handy zuerst, Tab-Leiste unten */
:root{color-scheme:light;--bg:#f6efe0;--card:#fffdf7;--ink:#1d2547;--navy:#1d2547;--amber:#e8a94a;--red:#d9574a;--green:#3f9d6b;--muted:#5b6280;--line:#1d2547;--soft:#e2d7bf}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;padding-bottom:96px}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.08;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,9vw,46px);color:var(--ink)}
a{color:var(--ink);font-weight:800}
#hdr{background:var(--navy);color:#f6efe0;padding:14px max(4vw,16px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:640px;margin:auto}
.logo{font-family:Anton,Impact,sans-serif;font-size:26px;color:var(--amber);font-style:italic;white-space:nowrap}
.logo b{background:var(--red);color:#fff;font-size:13px;padding:2px 5px;border-radius:4px;margin-left:6px;font-style:normal;vertical-align:middle}
.who{font-size:13px;text-align:right}
.who strong{display:block;font-size:15px;color:var(--amber)}
main{max-width:640px;margin:auto;padding:16px max(4vw,14px)}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:16px;margin-bottom:18px}
.card h2{font-size:24px;margin-bottom:4px}
.hero h1{margin-bottom:8px}
.center{text-align:center}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.small{font-size:13px;color:var(--muted)}
.note{background:var(--amber);color:var(--navy);font-weight:800;padding:10px 14px;border-radius:12px;margin-bottom:14px;border:2px solid var(--line)}
.err{color:var(--red);font-weight:800}
.warn{color:var(--red);font-weight:900}
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{background:var(--amber);color:var(--navy);font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag.sm{font-size:11px;padding:1px 8px}
.chips{display:flex;gap:8px;margin-bottom:14px;padding-bottom:4px}
.scroll{overflow-x:auto}
.chip{flex:none;font:800 14px Nunito,system-ui,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);color:var(--amber)}
.chip:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.dot{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;border:3px dashed var(--muted);background:none;cursor:pointer;font:900 18px Nunito,system-ui,sans-serif;color:#fff;display:grid;place-items:center;padding:0}
.dot.on{background:var(--green);border:3px solid var(--line)}
.dot.today{border-color:var(--red);border-style:solid}
.dot.on.today{border-color:var(--line)}
.dot:disabled{opacity:.3;cursor:default}
input:not([type=checkbox]):not([type=radio]),textarea{width:100%;font:16px Nunito,system-ui,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:76px;resize:vertical}
textarea.refl{margin-top:8px;flex-basis:100%}
.l{font-weight:800;font-size:14px;display:block;margin:12px 0 4px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.chk.m0{margin:0}
.chk input{width:22px;height:22px;accent-color:var(--green);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:800 16px Nunito,system-ui,sans-serif;background:var(--red);color:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 18px;box-shadow:3px 3px 0 var(--line);cursor:pointer;min-height:44px;text-align:center}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px;margin-top:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.lnk{background:none;border:0;padding:4px 0;font:800 14px Nunito,system-ui,sans-serif;color:inherit;text-decoration:underline;cursor:pointer}
.who .lnk{font-size:12px;color:#cfd3e6}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 140px;font:800 14px Nunito,system-ui,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;min-height:44px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--navy);color:#f6efe0;border-radius:14px;padding:12px;text-align:center;border:3px solid var(--line)}
.stat b{display:block;font:400 clamp(26px,8vw,36px) Anton,Impact,sans-serif;color:var(--amber)}
.stat span{font-size:12px;font-weight:700}
.bar{height:22px;background:#e9dfc8;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .6s}
.bar.g i{background:var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.cell{aspect-ratio:1;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:800 clamp(11px,3.3vw,15px)/1.25 Nunito,system-ui,sans-serif;padding:6px;cursor:pointer;display:grid;place-items:center;text-align:center}
.cell.on{background:var(--amber)}
.cell{hyphens:auto;overflow-wrap:anywhere}
.cell.star{border-color:var(--red)}
.banner{background:var(--red);color:#fff;font:400 22px Anton,Impact,sans-serif;text-align:center;padding:10px;border-radius:12px;margin:10px 0;animation:pop .4s}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}.bar i{transition:none}}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--soft)}
.list li.wrap{flex-wrap:wrap}
.list li:last-child{border:0}
.list li.click,tr.click{cursor:pointer}
.rank{font:400 22px Anton,Impact,sans-serif;width:28px;text-align:center;color:var(--muted);flex:none}
.me{background:#fbe7c2;border-radius:10px;padding-inline:8px!important}
.grow{flex:1}
.pts{font-weight:900;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800;background:var(--amber)}
.badge.off{background:none;color:var(--muted);border-style:dashed}
.goal{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 0}
.goal i{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.goal i.y{background:var(--green);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 5px;text-align:left;border-bottom:2px dashed var(--soft);vertical-align:top}
th{font-size:12px;color:var(--muted)}
td.n{text-align:right;white-space:nowrap}
.mt-t{min-width:440px}
tr.dim td{opacity:.5}
.detail{flex-basis:100%;background:#fbf3e2;border-radius:10px;padding:4px 12px 8px;cursor:default}
.chk.wrapok{white-space:normal}
li.dim{opacity:.55}
.meets{display:flex;gap:14px;flex-wrap:wrap}
.refltxt{font-size:14px;margin:4px 0;white-space:normal}
.code{font-family:ui-monospace,Menlo,monospace;background:#fbe7c2;padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.links{display:flex;flex-direction:column;gap:8px}
.links a{border:2px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;background:var(--card)}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#nav:not(:empty){border-top:3px solid var(--amber)}
#nav button{background:none;border:0;color:#cfd3e6;font:800 12px Nunito,system-ui,sans-serif;padding:10px 2px 12px;cursor:pointer;min-height:58px}
#nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
#nav button[aria-selected=true]{color:var(--amber)}
.status{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:92vw;text-align:center}
.status.show{opacity:1}
.status.retry{background:var(--red);pointer-events:auto;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(29,37,71,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;border:3px solid var(--line);padding:18px 16px 28px}
.x{background:none;border:0;font-size:32px;line-height:1;cursor:pointer;color:var(--ink);min-width:44px;min-height:44px}
.q{border:0;padding:0;margin:16px 0}
.q legend{font-weight:900;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--soft);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;font-weight:700}
.opt input{margin-top:3px;width:20px;height:20px;flex:none;accent-color:var(--navy)}
.opt.right{border-color:var(--green);background:#e3f3ea}
.opt.wrong{border-color:var(--red);background:#fbe4e1}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="status" class="status" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
// ===== Gemeinsame Logik (Seite und Google-Skript nutzen genau dieselbe) =====
var BY = {
  WEEKS: 6, DAYS: 42, SECTIONS: 8, KESIT: 6, MEET: 7,
  P: { day: 10, week7: 20, hayir: 15, saetze: 5, sec: 40, quiz: 10, kesit: 15, manga: 5, meet: 20, bingo: 5, superbingo: 15 },
  LINES: [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],

  lines: function (b) {
    if (!b) return 0;
    var n = 0;
    for (var i = 0; i < BY.LINES.length; i++) {
      var l = BY.LINES[i];
      if (b[l[0]] && b[l[1]] && b[l[2]]) n++;
    }
    return n;
  },
  full: function (b) {
    if (!b) return false;
    for (var i = 0; i < 9; i++) if (!b[i]) return false;
    return true;
  },
  // Tage zwischen zwei "yyyy-mm-dd"
  diff: function (a, b) {
    var pa = a.split('-'), pb = b.split('-');
    return Math.round((Date.UTC(+pb[0], pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], pa[1] - 1, +pa[2])) / 864e5);
  },
  addDays: function (iso, n) {
    var p = iso.split('-');
    var d = new Date(Date.UTC(+p[0], p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  },
  dayDone: function (st, i) {
    var w = st && st.w && st.w[Math.floor(i / 7) + 1];
    return !!(w && w.d && w.d[i % 7]);
  },
  // Zusammenfassung einer Schülerin. ctx = {start, today, book}
  summary: function (st, meet, ctx) {
    st = st || {};
    var P = BY.P, pts = 0, days = 0, k, i;
    var ti = BY.diff(ctx.start, ctx.today);           // Index von heute (0 = erster Tag)
    var soFar = Math.max(0, Math.min(BY.DAYS, ti + 1));
    for (k = 1; k <= BY.WEEKS; k++) {
      var w = (st.w && st.w[k]) || {};
      var c = 0;
      for (i = 0; i < 7; i++) if (w.d && w.d[i]) c++;
      days += c;
      pts += c * P.day + (c === 7 ? P.week7 : 0);
      if (w.hd) pts += P.hayir;
      if (w.s2 && String(w.s2).trim().length >= 5) pts += P.saetze;
    }
    var sec = 0, q = 0;
    for (i = 0; i < BY.SECTIONS; i++) {
      if (st.sec && st.sec[i]) sec++;
      if (ctx.book === 'de') { if (st.refl && st.refl[i] && String(st.refl[i]).trim().length >= 10) q++; }
      else if (st.quiz && st.quiz[i]) q++;
    }
    pts += sec * P.sec + q * P.quiz;
    var kes = 0;
    for (i = 0; i < BY.KESIT; i++) if (st.kes && st.kes[i]) kes++;
    pts += kes * P.kesit;
    var man = 0;
    if (st.man) for (k in st.man) if (st.man[k]) man++;
    pts += man * P.manga;
    var m = 0;
    for (i = 0; i < BY.MEET; i++) if (meet && meet[i]) m++;
    pts += m * P.meet;
    var bingoDays = 0, bingoToday = 0;
    if (st.bingo) for (k in st.bingo) {
      var b = st.bingo[k];
      if (BY.lines(b) > 0) { pts += P.bingo; bingoDays++; if (k === ctx.today) bingoToday = 1; }
      if (BY.full(b)) pts += P.superbingo;
    }
    // Serie: Tage am Stück bis heute (heute darf noch offen sein)
    var streak = 0;
    if (ti >= 0) {
      var j = Math.min(ti, BY.DAYS - 1);
      if (ti < BY.DAYS && !BY.dayDone(st, j)) j--;
      while (j >= 0 && BY.dayDone(st, j)) { streak++; j--; }
    }
    // Auf Kurs: alle vergangenen Tage erledigt
    var past = Math.max(0, Math.min(BY.DAYS, ti)), onCourse = true;
    for (i = 0; i < past; i++) if (!BY.dayDone(st, i)) { onCourse = false; break; }
    var goal = days === BY.DAYS && sec === BY.SECTIONS && kes === BY.KESIT && m === BY.MEET;
    return { pts: pts, days: days, soFar: soFar, streak: streak, onCourse: onCourse, sec: sec, q: q, kes: kes, man: man, meet: m, goal: goal, bingoDays: bingoDays, bingoToday: bingoToday, level: 1 + Math.floor(pts / 250) };
  }
};

// ===== Inhalte (Wochen, Buch, Quizze, Bingo, Gruppennamen) =====
var WEEKS = [
  { t: 'Fabrika ayarın ne?', idea: 'Zu Hause mit anpacken' },
  { t: 'Aynam kim?', idea: 'Jedem richtig zuhören' },
  { t: 'Kalbimi ne tıkıyor?', idea: 'Dich entschuldigen' },
  { t: 'Bir kelime yeter', idea: 'Nur freundliche Worte' },
  { t: 'Sahne senin mi?', idea: 'Andere loben' },
  { t: 'Direksiyonda kim var?', idea: 'Ruhig bleiben' }
];

var SECTIONS = [
  { t: 'Niçin Güzel Ahlâk Sahibi Olmalıyız?', a: 9, b: 22 },
  { t: 'Anne Baba Hakkı', a: 23, b: 62 },
  { t: 'Dostluk ve Arkadaşlık', a: 63, b: 88 },
  { t: 'Yardımlaşma', a: 89, b: 116 },
  { t: 'Doğruluk, Dürüstlük, Sözünde Durma', a: 117, b: 156 },
  { t: 'Âdâb-ı Muâşeret', a: 157, b: 196 },
  { t: 'Ek 1 · Kitap Okumanın Önemi', a: 197, b: 244 },
  { t: 'Ek 2 · Tarih Şuuru', a: 245, b: 259 }
];

// Eigene Fragen zum Inhalt (nicht die "Sorular" aus dem Buch). c = Index der richtigen Antwort, p = Seite
var QUIZ = [
  [
    { q: 'Hadise göre güzel ahlâk günahlara ne yapar?', o: ['Onları gizler', 'Güneşin kırağıyı erittiği gibi onları eritir', 'Onları ikiye katlar', 'Hiçbir etkisi yoktur'], c: 1, p: 11 },
    { q: 'Kötü ahlâk güzel amelleri, neyin balı bozduğu gibi bozar?', o: ['Tuzun', 'Sirkenin', 'Suyun', 'Ateşin'], c: 1, p: 12 },
    { q: 'Efendimiz kendisini hangi üç şeyden men etmişti?', o: ['Uyku, yemek ve gülmekten', 'Münakaşa, mübalağa ve gereksiz konuşmadan', 'Ticaret, yolculuk ve şiirden', 'Hediye, ziyafet ve sohbetten'], c: 1, p: 13 },
    { q: 'Hadise göre hediyeleşmek kalpteki neyi yok eder?', o: ['Kin ve nefreti', 'Korkuyu', 'Üzüntüyü', 'Unutkanlığı'], c: 0, p: 14 },
    { q: 'Hz. Bilal’in müezzinliğin yanında bir görevi daha vardı. Neydi?', o: ['Ordu komutanlığı', 'Ziyaretçiler ve ihtiyaç sahipleriyle ilgilenmek', 'Kur’an sayfalarını yazmak', 'Pazarı denetlemek'], c: 1, p: 15 }
  ],
  [
    { q: 'Hadiste anne-baba cennetin hangi kapısı olarak anılır?', o: ['İlk kapısı', 'Orta kapısı', 'Son kapısı', 'Gizli kapısı'], c: 1, p: 23 },
    { q: 'Âyette anne-babaya yapılması emredilen “ihsan” aynı zamanda ne demektir?', o: ['Allah’ı görüyormuş gibi davranmak', 'Sadece para vermek', 'Sadece selam vermek', 'Uzaktan dua etmek'], c: 0, p: 25 },
    { q: '“En çok kiminle vakit geçirmeliyim?” diye soran sahabiye Efendimiz kaç kez “Annen” dedi?', o: ['Bir', 'İki', 'Üç', 'Dört'], c: 2, p: 32 },
    { q: '“Hesap günü beni, anne-babamı ve müminleri bağışla” diye dua eden peygamber kimdir?', o: ['Hz. Musa', 'Hz. İbrahim', 'Hz. Nuh', 'Hz. İsa'], c: 1, p: 27 },
    { q: 'Bir âyete göre Allah, kendisine şükretmemizle birlikte kime de şükretmemizi ister?', o: ['Öğretmenlerimize', 'Anne ve babamıza', 'Komşularımıza', 'Arkadaşlarımıza'], c: 1, p: 52 }
  ],
  [
    { q: 'Kur’an’da “dost” anlamında en çok geçen kelime hangisidir?', o: ['Velî', 'Habîb', 'Refîk', 'Sadîk'], c: 0, p: 64 },
    { q: 'Kitaba göre Allah kimlerin dostudur?', o: ['Zengin olanların', 'İman edip salih amel işleyen, takva sahibi kulların', 'Sadece âlimlerin', 'Herkesin aynı şekilde'], c: 1, p: 71 },
    { q: 'İmam Şârânî, namaz kılmayanlarla oturup kalktığında ne fark etmişti?', o: ['Duygularının köreldiğini', 'Daha çok güldüğünü', 'Daha çok kitap okuduğunu', 'Hiçbir şey değişmediğini'], c: 0, p: 73 },
    { q: 'İyi bir dost olmak için verilen ilk tavsiye nedir?', o: ['Çok hediye almak', 'Lüzumsuz tenkit ve kırıcı sözlerden kaçınmak', 'Her gün buluşmak', 'Hep haklı çıkmak'], c: 1, p: 77 },
    { q: 'Bir âyete göre ahirette, kimler dışındaki dostlar birbirine düşman olur?', o: ['Akrabalar', 'Müttakîler (takva sahipleri)', 'Komşular', 'Çocukluk arkadaşları'], c: 1, p: 81 }
  ],
  [
    { q: 'Allah yolunda harcanan mal âyette neye benzetilir?', o: ['Yedi başak bitiren, her başağında yüz tane olan bir tohuma', 'Akan bir nehre', 'Sağlam bir eve', 'Parlayan bir yıldıza'], c: 0, p: 99 },
    { q: 'Şeyh Sâdî’ye göre biriktirilip paylaşılmayan para neye benzer?', o: ['Durup kokan suya', 'Kuru toprağa', 'Sönmüş ateşe', 'Boş bir kaba'], c: 0, p: 99 },

async function api(action, data) {

async function flush() {

// ---------- Tages-Bingo: gleiche Karte für alle ----------
function seedRand(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function bingoCard(date) {
  const r = seedRand('by' + date), pool = BINGO_POOL.slice(), pick = [];
  while (pick.length < 8) pick.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  pick.splice(4, 0, BINGO_STAR[curWeek() - 1]);
  return pick;
}

    'DTSTART;TZID=Europe/Berlin:' + d + 'T' + h + m + '00', 'DURATION:PT10M', 'RRULE:FREQ=DAILY;UNTIL=' + end + 'T225959Z',
    'SUMMARY:Benim Yolum – Tat eingetragen? 🔥', 'DESCRIPTION:Hast du deine Tat heute schon gemacht? ' + url, 'URL:' + url,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:Benim Yolum', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');

}

// ---------- Aktionen ----------
function copy(t) {
  const done = () => { const c = $('#copied'); if (c) c.textContent = 'Kopiert ✓ – jetzt in WhatsApp einfügen.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); }
}
async function loadStaff(group) {
  try { const j = await api('staffData', { code: S.staff.code, group: group || S.group || '' }); S.sd = j; S.cfg = j.cfg; S.staff = Object.assign(S.staff, j.who); }
  catch (e) { if (/gibt es nicht/.test(e.message)) { logout(); return; } alert2(e.message); }
  render();
}
function alert2(t) { setStatus(t, 4000); }
function logout() { LS.del('by-token'); LS.del('by-staff'); S = Object.assign(S, { mode: 'start', me: null, token: null, staff: null, sd: null, group: null, open: null, quiz: null, msg: '' }); render(); }
async function refreshBoard(force) {
  if (!force && S.board && Date.now() - S.boardAt < 60000) return;
  try { const j = await api('board'); S.board = j.board; S.boardAt = Date.now(); if (S.mode === 'girl') render(); } catch (e) {}
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'girl' && e.target.closest('[data-stop]')) return;
  const a = t.dataset.act;
  if (a === 'mode') { S.mode = t.dataset.v; S.msg = ''; render(); return; }
  if (a === 'neu') { keepForm(); S.form.neu = t.dataset.v === '1'; S.msg = ''; render(); return; }
  if (a === 'buch') { keepForm(); S.form.buch = t.dataset.v; render(); return; }
  if (a === 'logout') { logout(); return; }
  if (a === 'retry') { flush(); return; }
  if (a === 'tab') { S.tab = t.dataset.v; S.open = null; render(); window.scrollTo(0, 0); if (S.tab === 'gruppe') refreshBoard(true); else if (S.tab === 'heute') refreshBoard(); return; }
  if (a === 'week') { S.week = +t.dataset.k; render(); return; }
  if (a === 'day') { const k = S.week || curWeek(), w = wk(k), j = +t.dataset.j; w.d[j] = w.d[j] ? 0 : 1; changed(true); return; }
  if (a === 'hd') { wk(S.week || curWeek()).hd = t.checked ? 1 : 0; changed(false); return; }
  if (a === 'bingo') { const d = todayISO(), s = st(); const b = s.bingo[d] || [0, 0, 0, 0, 0, 0, 0, 0, 0]; const before = BY.lines(b); b[+t.dataset.i] = b[+t.dataset.i] ? 0 : 1; s.bingo[d] = b; if (S.board && BY.lines(b) > 0 !== before > 0) S.board.bingoToday += BY.lines(b) > 0 ? 1 : -1; changed(true); return; }
  if (a === 'sec') { const i = +t.dataset.i; st().sec[i] = t.checked ? 1 : 0; changed(true); return; }
  if (a === 'kes') { st().kes[+t.dataset.i] = t.checked ? 1 : 0; changed(false); return; }
  if (a === 'man') { st().man[t.dataset.n] = t.checked ? 1 : 0; changed(false); return; }
  if (a === 'quiz') { S.quiz = { i: +t.dataset.i, a: [] }; render(); return; }
  if (a === 'qa') { S.quiz.a[+t.dataset.n] = +t.dataset.m; const btn = document.querySelector('[data-act="qsend"]'); if (btn) btn.disabled = !QUIZ[S.quiz.i].every((q, n) => S.quiz.a[n] !== undefined); return; }
  if (a === 'qsend') { const i = S.quiz.i, Q = QUIZ[i], s = Q.reduce((x, q, n) => x + (S.quiz.a[n] === q.c ? 1 : 0), 0); st().quiz[i] = { a: S.quiz.a.slice(), s }; changed(true); document.querySelector('.sheet') && document.querySelector('.sheet').scrollTo(0, 0); return; }
  if (a === 'qclose') { S.quiz = null; render(); return; }
  if (a === 'hide') { st().hide = !t.checked; changed(false); return; }
  if (a === 'setbuch') { S.me.buch = t.dataset.v; changed(true); return; }
  if (a === 'virt') { S.open = S.open === t.dataset.c ? null : t.dataset.c; render(); return; }
  // Mitarbeiterinnen
  if (a === 'klasse') { S.klasse = t.dataset.v; render(); return; }
  if (a === 'grp') { S.group = t.dataset.c; S.open = null; S.sd.detail = null; render(); loadStaff(S.group); return; }
  if (a === 'grpback') { S.group = null; S.open = null; render(); return; }
  if (a === 'sreload') { setStatus('Wird aktualisiert …', 1500); loadStaff(); return; }
  if (a === 'girl') { S.open = S.open === t.dataset.id ? null : t.dataset.id; render(); return; }
  if (a === 'copy') { copy(t.dataset.t); return; }
  if (a === 'rename') { S.renaming = true; render(); return; }
  if (a === 'renamecancel') { S.renaming = false; render(); return; }
  if (a === 'renamesave') { const n = $('#newname').value; try { const j = await api('rename', { code: S.staff.code, group: S.sd.detail.code, name: n }); S.sd.detail.name = j.name; S.renaming = false; loadStaff(); } catch (x) { alert2(x.message); } return; }
  if (a === 'stamp') { const id = t.dataset.id, i = +t.dataset.i, v = t.checked; try { const j = await api('stamp', { code: S.staff.code, id, meet: i, value: v }); const x = S.sd.detail.girls.find(y => y.id === id); x.treffen = j.treffen; x.sum.meet = j.treffen.filter(Boolean).length; setStatus('Gespeichert ✓', 1500); render(); } catch (x) { t.checked = !v; alert2(x.message); } return; }
  if (a === 'count') { const id = t.dataset.id, v = t.checked; try { await api('setCount', { code: S.staff.code, id, value: v }); const x = S.sd.detail.girls.find(y => y.id === id); x.zaehlt = v; setStatus('Gespeichert ✓', 1500); render(); } catch (x) { t.checked = !v; alert2(x.message); } return; }
  if (a === 'pin') { const id = t.dataset.id; try { const j = await api('resetPin', { code: S.staff.code, id }); S.pinShown[id] = j.pin; render(); } catch (x) { alert2(x.message); } return; }
  if (a === 'remind') {
    const quiet = S.sd.detail.girls.filter(x => x.since >= 3 && x.zaehlt).map(x => x.name);
    const url = location.origin + location.pathname;
    const txt = quiet.length ? `Hallo ihr Lieben 🌸 ${quiet.join(', ')} – wir vermissen euch bei Benim Yolum! Tragt eure Tat der Woche ein, jeder Tag zählt für unser Gruppenziel 🔥 ${url}` : `Hallo ihr Lieben 🌸 Ihr seid super dabei! Denkt heute an eure Tat der Woche und das Tages-Bingo 🔥 ${url}`;
    copy(txt); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'remtime') { st().rem = t.value; const l = $('#icslink'); if (l) l.href = icsHref(t.value); changed(false); return; }
  const f = t.dataset && t.dataset.field; if (!f || S.mode !== 'girl') return;
  if (f === 'refl') { st().refl[t.dataset.i] = t.value; changed(false); return; }
  wk(S.week || curWeek())[f] = t.value; changed(false);
});
function keepForm() { const fm = document.querySelector('form[data-form="girl"]'); if (!fm) return; S.form.join = fm.join.value; S.form.name = fm.name.value; S.form.pin = fm.pin.value; }
document.addEventListener('submit', async e => {
  const fm = e.target; e.preventDefault();
  const btn = fm.querySelector('[type=submit]'); btn.disabled = true; S.msg = '';
  try {
    if (fm.dataset.form === 'staff') {
      const code = fm.code.value.trim();
      const j = await api('staffLogin', { code });
      S.staff = Object.assign({ code }, j.who); S.cfg = j.cfg; LS.set('by-staff', code); S.mode = 'staff'; S.sd = null; S.group = null; render(); loadStaff(); return;
    }
    keepForm();
    const data = { join: fm.join.value.trim(), name: fm.name.value.trim(), pin: fm.pin.value.trim(), buch: S.form.buch };
    const j = await api(S.form.neu ? 'register' : 'login', data);
    S.form.pin = '';
    enterGirl(j);
  } catch (x) { S.msg = x.message; render(); }
});
function enterGirl(j) {
  S.token = j.token || S.token; LS.set('by-token', S.token);
  S.me = j.me; fix(S.me.st); S.cfg = j.cfg; S.board = j.board; S.boardAt = Date.now();
  const bk = LS.get('by-backup');
  const restore = bk && bk.id === S.me.id && LS.get('by-unsaved');
  if (restore) { S.me.st = fix(bk.st); S.me.buch = bk.buch || S.me.buch; }
  S.mode = 'girl'; S.week = 0; render();
  if (restore) changed(false);
}

// ---------- Start ----------
(async function init() {
  if (!API) { S.mode = 'nocfg'; render(); return; }
  const tok = LS.get('by-token'), sc = LS.get('by-staff');
  render();
  if (tok) { try { S.token = tok; const j = await api('load', { token: tok }); enterGirl(j); return; } catch (e) { LS.del('by-token'); } }
  if (sc) { try { const j = await api('staffLogin', { code: sc }); S.staff = Object.assign({ code: sc }, j.who); S.cfg = j.cfg; S.mode = 'staff'; render(); loadStaff(); return; } catch (e) { LS.del('by-staff'); } }
  S.mode = 'start'; render();
})();
}

</script>
</body>
